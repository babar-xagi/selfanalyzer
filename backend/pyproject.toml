[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversation-coach-backend"
version = "0.1.0"
description = "Local session, recording, and transcription API for Conversation Coach"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
